# Allowed styles (the processing look). Order here is the order in the Style filter.
#
# Matched against a photo's keywords and Drive folder names, as in categories.yaml.
# A photo has one style. When several match, the first one in this list wins, but
# the default style only wins when nothing else matches, so the keywords "film"
# and "colour" give film. No match at all gives the default style.
- id: colour
  label: Colour
  match: [color, kleur]
  default: true
- id: black-and-white
  label: Black and white
  match: [zwart-wit, zwartwit, zw, bw, b&w, monochrome, black & white]
- id: film
  label: Film
  match: [analoog, analog, analogue, 35mm, kodak, portra, ilford]
