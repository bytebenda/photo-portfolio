# Allowed categories. Order here is the order in the Categories filter.
# A category shows up in the filter as soon as one photo uses it.
#
# A photo gets every category whose words appear in its keywords (set in
# Lightroom, Capture One or the Fujifilm app and stored in the file), its Google
# Drive folder names or #hashtags in its Drive description. photos.yaml overrides.
#
# match: extra words for this category; the id and label always match. Words
# match as whole words, without regard to case or accents: the keyword "Straat"
# matches street, "Straatsburg" does not.
- id: street
  label: Street
  match: [straat, straatfotografie, streetphotography]
- id: travel
  label: Travel
  match: [reis, reizen, vakantie, trip, citytrip]
- id: landscape
  label: Landscape
  match: [landschap, landschappen, natuur, nature, bos, zee, bergen]
- id: portrait
  label: Portrait
  match: [portret, portretten, portraits, mensen, people]
- id: architecture
  label: Architecture
  match: [architectuur, gebouwen, buildings]
