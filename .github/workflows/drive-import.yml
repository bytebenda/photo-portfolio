# Imports the photos from Google Drive and commits them, so Vercel builds the
# site with the new photos. Run it from the Actions tab ("Run workflow"); it also
# runs every Monday morning and when the import script or this file changes.
#
# Optional repository secrets (Settings, Secrets and variables, Actions):
#   GOOGLE_API_KEY          an API key, for a folder shared as "anyone with the link"
#   GOOGLE_SERVICE_ACCOUNT  the service account key JSON, for a private folder
# Without either, the folder must be shared as "anyone with the link".
name: Import photos from Google Drive

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Download every photo again and keep the changed ones (after adding keywords to photos already in Drive)
        type: boolean
        default: false
  push:
    paths:
      - scripts/drive-import.mjs
      - .github/workflows/drive-import.yml
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

concurrency:
  group: drive-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import
        run: |
          npm ci
          npm run import -- ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No changes in Google Drive"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import photos from Google Drive"
          git pull --rebase
          git push
